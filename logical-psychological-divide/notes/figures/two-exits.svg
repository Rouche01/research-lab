<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="title2 desc2">
  <title id="title2">Two exits of the same minimization</title>
  <desc id="desc2">Left panel: reweighting. Same teal basis, a faint previous coral state and a new coral state: psychological novelty. Right panel: expansion. A faint new teal axis appears, and the coral state uses it: logical novelty.</desc>
  <rect width="1100" height="520" fill="#141414" rx="8"/>
  <rect x="330" y="18" width="440" height="28" rx="6" fill="#2a2a2a"/>
  <text x="550" y="37" text-anchor="middle" fill="#d4d4d4" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">Two exits of the same minimization</text>

  <text x="275" y="78" text-anchor="middle" fill="#e07a5f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500">Reweighting: psychological novelty</text>
  <g transform="translate(70,100)" fill="none" stroke-linecap="round">
    <line x1="70" y1="280" x2="70" y2="28" stroke="#2a9d8f" stroke-width="3.2"/>
    <polygon points="70,16 63,34 77,34" fill="#2a9d8f" stroke="none"/>
    <line x1="70" y1="280" x2="390" y2="280" stroke="#2a9d8f" stroke-width="3.2"/>
    <polygon points="404,280 386,273 386,287" fill="#2a9d8f" stroke="none"/>

    <line x1="70" y1="280" x2="248" y2="118" stroke="#e07a5f" stroke-width="2.2" stroke-dasharray="6 6" opacity="0.45"/>
    <polygon points="258,108 240,118 254,130" fill="#e07a5f" stroke="none" opacity="0.45"/>

    <line x1="70" y1="108" x2="318" y2="108" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="5 6"/>
    <line x1="318" y1="108" x2="318" y2="280" stroke="#6b6b6b" stroke-width="1.4" stroke-dasharray="5 6"/>
    <line x1="70" y1="280" x2="306" y2="120" stroke="#e07a5f" stroke-width="3.2"/>
    <polygon points="318,108 296,120 312,132" fill="#e07a5f" stroke="none"/>

    <circle cx="70" cy="280" r="5.5" fill="#9a9a9a" stroke="#141414" stroke-width="2"/>
  </g>
  <text x="275" y="422" text-anchor="middle" fill="#c8c8c8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">same A, same B</text>
  <text x="275" y="444" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">new coefficients, still inside the space</text>
  <text x="148" y="128" fill="#2a9d8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">B</text>
  <text x="448" y="392" fill="#2a9d8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">A</text>

  <line x1="550" y1="88" x2="550" y2="460" stroke="#2f2f2f" stroke-width="1"/>

  <text x="825" y="78" text-anchor="middle" fill="#2a9d8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="500">Expansion: logical novelty</text>
  <g transform="translate(600,100)" fill="none" stroke-linecap="round">
    <line x1="80" y1="280" x2="80" y2="28" stroke="#2a9d8f" stroke-width="3.2"/>
    <polygon points="80,16 73,34 87,34" fill="#2a9d8f" stroke="none"/>
    <line x1="80" y1="280" x2="360" y2="280" stroke="#2a9d8f" stroke-width="3.2"/>
    <polygon points="374,280 356,273 356,287" fill="#2a9d8f" stroke="none"/>

    <line x1="80" y1="280" x2="250" y2="48" stroke="#2a9d8f" stroke-width="2.4" stroke-dasharray="7 6" opacity="0.7"/>
    <polygon points="258,38 240,54 258,58" fill="#2a9d8f" stroke="none" opacity="0.75"/>

    <line x1="80" y1="280" x2="230" y2="160" stroke="#e07a5f" stroke-width="2" opacity="0.3"/>

    <line x1="80" y1="280" x2="246" y2="62" stroke="#e07a5f" stroke-width="3.2"/>
    <polygon points="258,48 236,64 252,74" fill="#e07a5f" stroke="none"/>

    <circle cx="80" cy="280" r="5.5" fill="#9a9a9a" stroke="#141414" stroke-width="2"/>
  </g>
  <text x="825" y="422" text-anchor="middle" fill="#c8c8c8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">new generator C</text>
  <text x="825" y="444" text-anchor="middle" fill="#8d8d8d" font-family="ui-sans-serif, system-ui, sans-serif" font-size="13">the space itself grows</text>
  <text x="692" y="128" fill="#2a9d8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">B</text>
  <text x="980" y="392" fill="#2a9d8f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">A</text>
  <text x="868" y="138" fill="#5ec4b6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">C (new)</text>

  <text x="550" y="492" text-anchor="middle" fill="#6e6e6e" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12">Teal = logical basis (atemporal once found). Coral = psychological state (temporal combination).</text>
</svg>
